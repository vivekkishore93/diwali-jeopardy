<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e45">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Buzzer</title>
<link rel="stylesheet" href="/css/common.css">
<style>
  html, body { height: 100%; overflow: hidden; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { background: radial-gradient(ellipse at 50% 0%, #1a1f7a, #0b0e45 60%, #05061f); display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); border-bottom: 4px solid var(--c, var(--gold)); background: rgba(0,0,0,.25); }
  .tname { flex: 1; font-family: var(--font-cat); font-weight: 700; font-size: 24px; text-transform: uppercase; letter-spacing: 1px; color: var(--cream); }
  .tscore { font-family: var(--font-value); font-size: 30px; color: var(--gold); }
  .tscore.neg { color: var(--bad); }
  .switch { background: none; border: 1px solid rgba(255,255,255,.25); color: var(--cream); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 18px; text-align: center; }
  .msg { font-size: 20px; min-height: 56px; line-height: 1.35; }
  .msg b { color: var(--gold-hi); }
  .title { font-family: var(--font-title); color: var(--gold); font-size: 34px; }

  #buzz {
    width: min(78vw, 56vh); aspect-ratio: 1; border-radius: 50%; border: 0;
    font-family: var(--font-value); font-size: min(17vw, 12vh); letter-spacing: 2px; color: #fff; text-shadow: 3px 3px 0 rgba(0,0,0,.4);
    background: radial-gradient(circle at 35% 30%, #6b6f9a, #3a3d63 60%, #24264a); box-shadow: 0 12px 0 #15172f, 0 20px 40px rgba(0,0,0,.5);
    transition: transform .06s, box-shadow .06s, background .2s;
  }
  #buzz.ready { background: radial-gradient(circle at 35% 30%, #ff9c5a, var(--saffron) 45%, #c2410c); box-shadow: 0 12px 0 #7c2d12, 0 0 60px rgba(255,122,26,.7); animation: glow 1s ease-in-out infinite; }
  #buzz.wait { background: radial-gradient(circle at 35% 30%, #ffe08a, var(--gold) 50%, #a87411); box-shadow: 0 12px 0 #6e4b0b; color: #3b2a00; text-shadow: none; }
  #buzz.won { background: radial-gradient(circle at 35% 30%, #8ff0b7, var(--good) 50%, #1d8a4f); box-shadow: 0 12px 0 #0f5a31, 0 0 80px rgba(61,220,132,.8); }
  #buzz.locked { filter: grayscale(1) brightness(.5); }
  #buzz:active, #buzz.pressed { transform: translateY(10px); box-shadow: 0 2px 0 #15172f; }
  @keyframes glow { 50% { box-shadow: 0 12px 0 #7c2d12, 0 0 100px rgba(255,180,60,.95); } }

  .teams { display: flex; flex-direction: column; gap: 14px; width: min(420px, 90vw); }
  .teams button { padding: 20px; border-radius: 16px; border: 0; font-family: var(--font-cat); font-weight: 700; font-size: 26px; text-transform: uppercase; color: #fff; background: rgba(255,255,255,.08); border-left: 14px solid var(--c); text-align: left; }
  form { display: flex; flex-direction: column; gap: 12px; width: min(420px, 90vw); }
  input { font: inherit; font-size: 24px; padding: 16px; border-radius: 14px; border: 2px solid rgba(255,255,255,.25); background: #050729; color: var(--cream); text-align: center; }
  .go { padding: 18px; border: 0; border-radius: 14px; font-size: 22px; font-weight: 800; background: var(--gold); color: var(--ink); }
  .locked-note { color: var(--good); font-weight: 700; }
  .conn { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); background: var(--bad); color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 14px; }
  .err { color: #ffb3b3; min-height: 20px; }
</style>
</head>
<body>
<header id="hdr" class="hidden">
  <div class="tname" id="tname"></div>
  <div class="tscore" id="tscore"></div>
  <button class="switch" id="switch">Switch</button>
</header>
<main id="main"></main>
<div id="conn" class="conn hidden">Reconnecting…</div>
<script type="module" src="/js/play.js"></script>
</body>
</html>
